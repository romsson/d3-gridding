<!DOCTYPE html>
<meta charset="utf-8">
<style>
body {
  font-family: Helvetica;
  font-size: 10px;
}
.point {
  fill: black;
}

rect, circle {
  fill: none;
  stroke: black;
  stroke-width: 1;
}
</style>
<body>
<script src="../node_modules/d3/dist/d3.js"></script>
<script src="../dist/d3-gridding.js"></script>

<script>

var width = 400,
    height = 300;

var gridding = d3.gridding()
  .size([width, height])
  .mode("grid");

// SVG Marks
var marks = ["rect", "circle", "line", "ellipse"];
var properties = ["size", "color", "rotation", "thickness", "opacity", "luminance"];


var data =  [];

marks.map(function(d, i) {
  properties.map(function(e, j) {
    data.push({"value" : d + " x " + e});
  });
});

var svgSquares = d3.select("body").append("svg")
    .attr("width", width)
    .attr("height", height)
  .append("g");

svgSquares.selectAll(".square")
    .data(gridding(data), function(d) { return d.index; })
  .enter()
    .append("rect")
    .attr("class", "square")
    .attr("width", function(d) { return d.width; })
    .attr("height", function(d) { return d.height; })
    .attr("transform", function(d) { return "translate(" + d.x + "," + d.y + ")"; })

svgSquares.selectAll(".index")
    .data(gridding(data))
  .enter()
    .append("text")
    .attr("class", "index")
    .style("text-anchor", "middle")
    .style('dominant-baseline', 'central')
    .attr("transform", function(d) { return "translate(" + d.cx + "," + d.cy + ")"; })
    .text(function(d, i) { return d.value; });

</script>
